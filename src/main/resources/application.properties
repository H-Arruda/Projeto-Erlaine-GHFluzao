spring.application.name=ghflusao

spring.datasource.url=jdbc:postgresql://localhost:5432/ghflusao
spring.datasource.username=ghflusao
spring.datasource.password=ghflusao

# O esquema é criado pelo Flyway (db/migration). O Hibernate não altera o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.forward-headers-strategy=framework