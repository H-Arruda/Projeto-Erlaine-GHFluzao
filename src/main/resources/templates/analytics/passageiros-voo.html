<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Passageiros por voo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div th:replace="~{fragments/componentes :: cabecalho('Passageiros por voo', 'Consulte quem possui bilhete em cada voo.', null, null)}"></div>

    <div class="gh-card mb-4">
        <form class="gh-filter" method="get" th:action="@{/analytics/passageiros-por-voo}">
            <div class="flex-grow-1" style="max-width: 460px;">
                <label class="form-label" for="vooId">Voo</label>
                <select class="form-select" id="vooId" name="vooId" required>
                    <option value="">Selecione um voo</option>
                    <option th:each="v : ${voos}" th:value="${v.id()}" th:text="${v.rotulo()}"
                            th:selected="${vooId != null and v.id() == vooId}">GH101 · Empresa</option>
                </select>
            </div>
            <div>
                <button class="btn btn-primary" type="submit">Consultar</button>
            </div>
        </form>
    </div>

    <div class="alert alert-info gh-alert" th:if="${#lists.isEmpty(voos)}">
        <svg class="gh-ico" aria-hidden="true"><use href="#i-inbox"/></svg><span>Nenhum voo cadastrado.</span>
    </div>
    <div class="alert alert-danger gh-alert" role="alert" th:if="${erro}">
        <svg class="gh-ico" aria-hidden="true"><use href="#i-alert"/></svg><span th:text="${erro}"></span>
    </div>

    <div th:if="${relatorio != null}">
        <div class="gh-card mb-3">
            <div class="gh-report-head">
                <div>
                    <h2 class="gh-report-title" th:text="${relatorio.voo().codigoVoo()} + ' · ' + ${relatorio.voo().empresa()}">GH101</h2>
                    <div class="gh-route" th:if="${relatorio.rota() != ''}" th:text="'Rota: ' + ${relatorio.rota()}">Rota</div>
                </div>
                <div class="text-md-end">
                    <div>Situação do voo: <span th:replace="~{fragments/componentes :: situacao(${relatorio.voo().situacao()})}"></span></div>
                    <div class="text-muted small mt-1" th:text="'Valor do voo: ' + ${relatorio.voo().valorFormatado()}">R$ 0,00</div>
                </div>
            </div>
            <hr>
            <span class="me-4"><strong th:text="${relatorio.validos()}">0</strong> bilhete(s) válido(s)</span>
            <span><strong th:text="${relatorio.cancelados()}">0</strong> cancelado(s)</span>
        </div>

        <div class="gh-card gh-table-card"><div class="gh-table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead><tr><th>Passageiro</th><th>CPF</th><th>Emissão</th><th class="text-end">Valor</th><th>Situação</th></tr></thead>
                <tbody>
                <tr th:each="p : ${relatorio.passageiros()}" th:classappend="${p.cancelado()} ? 'text-muted'">
                    <td class="fw-semibold" th:text="${p.nome()}">Nome</td>
                    <td th:text="${p.cpfFormatado()}">000.000.000-00</td>
                    <td th:text="${p.dataFormatada()}">01/01/2026 10:00</td>
                    <td class="text-end" th:text="${p.valorFormatado()}">R$ 0,00</td>
                    <td><span th:replace="~{fragments/componentes :: situacao(${p.situacao()})}"></span></td>
                </tr>
                <th:block th:if="${#lists.isEmpty(relatorio.passageiros())}">
                    <tr th:replace="~{fragments/componentes :: linhaVazia(5, 'Nenhum bilhete emitido para este voo.')}"></tr>
                </th:block>
                </tbody>
            </table>
        </div></div>
    </div>
</main>
</body>
</html>
