<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cidades')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div th:replace="~{fragments/componentes :: cabecalho('Cidades', 'Cidades atendidas pelos aeroportos.', @{/cidades/novo}, 'Nova cidade')}"></div>
    <div th:replace="~{fragments/componentes :: alertas}"></div>

    <div class="gh-card gh-table-card">
        <div class="gh-table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead><tr><th>ID</th><th>Nome</th><th>UF</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="r : ${registros}">
                    <td class="gh-id" th:text="${r.id}"></td>
                    <td class="fw-semibold" th:text="${r.nome}"></td>
                    <td><span class="gh-code" th:text="${r.uf}"></span></td>
                    <td class="text-end">
                        <div th:replace="~{fragments/componentes :: acoes(@{/cidades/{id}/editar(id=${r.id})}, @{/cidades/{id}/excluir(id=${r.id})}, null, 'Excluir este registro?')}"></div>
                    </td>
                </tr>
                <th:block th:if="${#lists.isEmpty(registros)}">
                    <tr th:replace="~{fragments/componentes :: linhaVazia(4, 'Nenhum registro encontrado.')}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
