<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cidade')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div class="gh-page-head">
        <div>
            <h1 class="gh-page-title" th:text="${id == null} ? 'Nova cidade' : 'Editar cidade'">Cadastro</h1>
            <p class="gh-page-sub">Informe o nome e a UF da cidade.</p>
        </div>
    </div>

    <div class="gh-narrow"><div th:replace="~{fragments/componentes :: alertas}"></div></div>

    <div class="gh-card gh-form-card">
        <form th:action="@{/cidades}" method="post">
            <input type="hidden" name="id" th:value="${id}">
            <div class="mb-3"><label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" name="nome" maxlength="100" required th:value="${nome}">
            </div>
            <div class="mb-3"><label class="form-label" for="uf">UF (ex.: RJ)</label>
                <input class="form-control" id="uf" name="uf" maxlength="2" required th:value="${uf}">
            </div>
            <div th:replace="~{fragments/componentes :: formAcoes(@{/cidades})}"></div>
        </form>
    </div>
</main>
</body>
</html>
