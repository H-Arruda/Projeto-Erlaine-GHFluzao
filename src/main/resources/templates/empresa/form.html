<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empresa')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div class="gh-page-head">
        <div>
            <h1 class="gh-page-title" th:text="${empresa.id == null} ? 'Nova empresa' : 'Editar empresa'">Empresa</h1>
            <p class="gh-page-sub">Informe os dados da companhia aérea.</p>
        </div>
    </div>

    <div class="gh-narrow"><div th:replace="~{fragments/componentes :: alertas}"></div></div>

    <div class="gh-card gh-form-card">
        <form th:action="@{/empresas}" th:object="${empresa}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="cnpj">CNPJ (14 dígitos)</label>
                <input class="form-control" id="cnpj" th:field="*{cnpj}" maxlength="14"
                       th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{cnpj}"></div>
            </div>

            <div th:replace="~{fragments/componentes :: formAcoes(@{/empresas})}"></div>
        </form>
    </div>
</main>
</body>
</html>
