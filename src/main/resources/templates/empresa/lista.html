<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empresas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div th:replace="~{fragments/componentes :: cabecalho('Empresas', 'Companhias aéreas cadastradas no sistema.', @{/empresas/nova}, 'Nova empresa')}"></div>
    <div th:replace="~{fragments/componentes :: alertas}"></div>

    <div class="gh-card gh-table-card">
        <div class="gh-table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr><th>ID</th><th>Nome</th><th>CNPJ</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empresas}">
                    <td class="gh-id" th:text="${e.id}"></td>
                    <td class="fw-semibold" th:text="${e.nome}"></td>
                    <td th:text="${e.cnpj}"></td>
                    <td class="text-end">
                        <div th:replace="~{fragments/componentes :: acoes(@{/empresas/{id}/editar(id=${e.id})}, @{/empresas/{id}/excluir(id=${e.id})}, null, 'Excluir esta empresa?')}"></div>
                    </td>
                </tr>
                <th:block th:if="${#lists.isEmpty(empresas)}">
                    <tr th:replace="~{fragments/componentes :: linhaVazia(4, 'Nenhuma empresa cadastrada.')}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
