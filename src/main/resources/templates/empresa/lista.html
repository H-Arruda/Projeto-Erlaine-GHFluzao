<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empresas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Empresas</h1>
        <a class="btn btn-primary" th:href="@{/empresas/nova}">Nova empresa</a>
    </div>

    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <table class="table table-striped align-middle">
        <thead>
        <tr><th>ID</th><th>Nome</th><th>CNPJ</th><th class="text-end">Ações</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${empresas}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.nome}"></td>
            <td th:text="${e.cnpj}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/empresas/{id}/editar(id=${e.id})}">Editar</a>
                <form class="d-inline" method="post" th:action="@{/empresas/{id}/excluir(id=${e.id})}"
                      onsubmit="return confirm('Excluir esta empresa?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(empresas)}">
            <td colspan="4" class="text-center text-muted">Nenhuma empresa cadastrada.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
