<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Aeroportos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <div th:replace="~{fragments/componentes :: cabecalho('Aeroportos', 'Aeroportos de origem e destino das escalas.', @{/aeroportos/novo}, 'Novo aeroporto')}"></div>
    <div th:replace="~{fragments/componentes :: alertas}"></div>

    <div class="gh-card gh-table-card">
        <div class="gh-table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead><tr><th>ID</th><th>Nome</th><th>Sigla</th><th>Cidade</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="r : ${registros}">
                    <td class="gh-id" th:text="${r.id}"></td>
                    <td class="fw-semibold" th:text="${r.nome}"></td>
                    <td><span class="gh-code" th:text="${r.sigla}"></span></td>
                    <td th:text="${r.cidade.nome}"></td>
                    <td class="text-end">
                        <div th:replace="~{fragments/componentes :: acoes(@{/aeroportos/{id}/editar(id=${r.id})}, @{/aeroportos/{id}/excluir(id=${r.id})}, null, 'Excluir este registro?')}"></div>
                    </td>
                </tr>
                <th:block th:if="${#lists.isEmpty(registros)}">
                    <tr th:replace="~{fragments/componentes :: linhaVazia(5, 'Nenhum registro encontrado.')}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
