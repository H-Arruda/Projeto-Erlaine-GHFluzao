<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Passageiros')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
 <div class="d-flex justify-content-between align-items-center mb-3">
 <h1 class="h3">Passageiros</h1><a class="btn btn-primary" th:href="@{/passageiros/novo}">Novo(a) passageiro</a></div>
 <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
 <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
 <table class="table table-striped align-middle">
 <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th class="text-end">Ações</th></tr></thead><tbody>
 <tr th:each="r : ${registros}">
           <td th:text="${r.id}"></td>
          <td th:text="${r.nome}"></td>
          <td th:text="${r.cpf}"></td>
 <td class="text-end">
   <a class="btn btn-sm btn-outline-secondary" th:href="@{/passageiros/{id}/editar(id=${r.id})}">Editar</a>
   <form class="d-inline" method="post" th:action="@{/passageiros/{id}/excluir(id=${r.id})}" onsubmit="return confirm('Excluir este registro?');">
      <button class="btn btn-sm btn-outline-danger">Excluir</button>
   </form>
 </td></tr>
 <tr th:if="${#lists.isEmpty(registros)}"><td colspan="4" class="text-center text-muted">Nenhum registro encontrado.</td></tr>
 </tbody></table>
</main>
</body></html>
