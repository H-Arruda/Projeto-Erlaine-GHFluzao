<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Passageiro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width:650px">
  <h1 class="h3 mb-3" th:text="${id == null} ? 'Novo(a) passageiro' : 'Editar passageiro'">Cadastro</h1>
  <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
  <form th:action="@{/passageiros}" method="post">
    <input type="hidden" name="id" th:value="${id}">
    <div class="mb-3"><label class="form-label" for="nome">Nome</label>
          <input class="form-control" id="nome" name="nome" maxlength="100" required th:value="${nome}">
          </div>
    <div class="mb-3"><label class="form-label" for="cpf">CPF (11 números)</label>
          <input class="form-control" id="cpf" name="cpf" maxlength="11" required th:value="${cpf}">
          </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-link" th:href="@{/passageiros}">Cancelar</a>
  </form>
</main>
</body>
</html>
