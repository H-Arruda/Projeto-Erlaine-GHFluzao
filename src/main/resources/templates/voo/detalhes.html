<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do voo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3" th:text="'Voo ' + ${voo.codigoVoo}">Voo</h1>
        <a class="btn btn-outline-secondary" th:href="@{/voos}">Voltar</a>
    </div>
    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">Empresa</div><strong th:text="${voo.empresa.nome}"></strong></div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">Situação</div><strong th:text="${voo.situacao}"></strong></div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">Preço total</div>
          <strong th:text="'R$ ' + ${#numbers.formatDecimal(voo.valor,1,'POINT',2,'COMMA')}"></strong></div></div></div>
    </div>
    <h2 class="h5">Itinerário / Escalas</h2>
    <table class="table table-striped align-middle">
        <thead><tr><th>Seq.</th><th>Origem</th><th>Destino</th><th>Duração (min)</th><th>Valor (R$)</th></tr></thead>
        <tbody>
        <tr th:each="e : ${voo.escalas}">
            <td th:text="${e.sequencial}"></td><td th:text="${e.origem.sigla}"></td><td th:text="${e.destino.sigla}"></td>
            <td th:text="${e.tempoEscala}"></td><td th:text="${#numbers.formatDecimal(e.valor,1,'POINT',2,'COMMA')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(voo.escalas)}"><td colspan="5" class="text-center text-muted">Adicione o primeiro trecho.</td></tr>
        </tbody>
    </table>
    <section th:if="${voo.situacao.name() == 'PROGRAMADO'}" class="card mb-4"><div class="card-body">
        <h2 class="h5">Adicionar trecho</h2>
        <form class="row g-3" method="post" th:action="@{/voos/{id}/escalas(id=${voo.id})}">
            <div class="col-md-6"><label class="form-label">Origem</label>
                <select class="form-select" name="origemId" required><option value="">Selecione...</option>
                    <option th:each="a : ${aeroportos}" th:value="${a.id}" th:text="${a.sigla + ' — ' + a.nome}"></option>
                </select></div>
            <div class="col-md-6"><label class="form-label">Destino</label>
                <select class="form-select" name="destinoId" required><option value="">Selecione...</option>
                    <option th:each="a : ${aeroportos}" th:value="${a.id}" th:text="${a.sigla + ' — ' + a.nome}"></option>
                </select></div>
            <div class="col-md-6"><label class="form-label">Duração em minutos</label>
                <input class="form-control" type="number" name="tempoEscala" min="1" required></div>
            <div class="col-md-6"><label class="form-label">Valor do trecho (R$)</label>
                <input class="form-control" type="number" name="valor" min="0" max="99999999.99" step="0.01" required></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Adicionar escala</button></div>
        </form>
        <form class="mt-3" method="post" th:action="@{/voos/{id}/escalas/remover-ultima(id=${voo.id})}"
              th:if="${!#lists.isEmpty(voo.escalas)}" onsubmit="return confirm('Remover o último trecho?');">
            <button class="btn btn-outline-danger btn-sm" type="submit">Remover último trecho</button>
        </form>
    </div></section>
    <section class="card"><div class="card-body">
        <h2 class="h5">Alterar situação</h2>
        <p class="text-muted small">Fluxo: PROGRAMADO → EM_ANDAMENTO → CONCLUIDO; PROGRAMADO → CANCELADO.</p>
        <form class="row g-3 align-items-end" method="post" th:action="@{/voos/{id}/situacao(id=${voo.id})}">
            <div class="col-md-6"><label class="form-label">Nova situação</label>
                <select name="situacao" class="form-select" required>
                    <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s}" th:selected="${s == voo.situacao}"></option>
                </select>
            </div>
            <div class="col-md-auto"><button class="btn btn-outline-primary" type="submit">Atualizar</button></div>
        </form>
    </div></section>
</main>
</body>
</html>
