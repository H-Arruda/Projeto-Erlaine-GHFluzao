<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do bilhete')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 900px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3" th:text="|Bilhete #${bilhete.id}|"></h1>
        <a class="btn btn-outline-secondary" th:href="@{/bilhetes}">Voltar</a>
    </div>
    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="row g-3 mb-4">
        <div class="col-md-6"><div class="card"><div class="card-body"><small class="text-muted">Passageiro</small><p class="fw-bold mb-0" th:text="${bilhete.passageiro.nome}"></p></div></div></div>
        <div class="col-md-6"><div class="card"><div class="card-body"><small class="text-muted">Voo</small><p class="fw-bold mb-0" th:text="${bilhete.voo.codigoVoo}"></p></div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body"><small class="text-muted">Situação</small><p class="fw-bold mb-0" th:text="${bilhete.situacao}"></p></div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body"><small class="text-muted">Valor fixado na emissão</small><p class="fw-bold mb-0" th:text="|R$ ${#numbers.formatDecimal(bilhete.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></p></div></div></div>
        <div class="col-md-4"><div class="card"><div class="card-body"><small class="text-muted">Data da emissão</small><p class="fw-bold mb-0" th:text="${#temporals.format(bilhete.dataEmissao, 'dd/MM/yyyy HH:mm')}"></p></div></div></div>
    </div>
    <div class="card" th:if="${bilhete.situacao.name() == 'EMITIDO'}">
        <div class="card-body">
            <h2 class="h5">Atualizar bilhete</h2>
            <p class="small text-muted">É possível cancelar um bilhete emitido. Para utilizá-lo, o voo precisa estar concluído. As mudanças são definitivas.</p>
            <div class="d-flex gap-2 flex-wrap">
                <form method="post" th:action="@{/bilhetes/{id}/situacao(id=${bilhete.id})}" th:if="${bilhete.voo.situacao.name() == 'CONCLUIDO'}" onsubmit="return confirm('Marcar este bilhete como UTILIZADO?');">
                    <input type="hidden" name="situacao" value="UTILIZADO">
                    <button class="btn btn-success" type="submit">Marcar como utilizado</button>
                </form>
                <form method="post" th:action="@{/bilhetes/{id}/situacao(id=${bilhete.id})}" onsubmit="return confirm('Cancelar este bilhete?');">
                    <input type="hidden" name="situacao" value="CANCELADO">
                    <button class="btn btn-outline-danger" type="submit">Cancelar bilhete</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
